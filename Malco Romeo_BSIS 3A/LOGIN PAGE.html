<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    :root {
      --primary-color: #b39225;
      --primary-hover: #755c08;
      --bg-gradient: linear-gradient(135deg, #0b208a 0%, #4b863c 100%);
      --card-bg: #092422c2;
      --text-main: rgb(20, 93, 196);
      --text-muted: #c6cbd4;
      --border-color: #63bb1a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      color: var(--text-main);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-wrapper label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-top: 4px;
    }

    .form-actions a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }

    .form-actions a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <main class="login-card">
    <header class="login-header">
      <h1>LOGIN FORM</h1>
      <p>Please enter your credentials to sign in</p>
    </header>

    <form onsubmit="event.preventDefault(); alert('Successfully logged in!');" class="form-group">
      <div class="input-wrapper">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter your username" required />
      </div>

      <div class="input-wrapper">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required />
      </div>

      <div class="form-actions">
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">LOGIN</button>
    </form>
  </main>

</body>
</html>
